<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="canvas" x1="60" y1="40" x2="452" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1235"/>
      <stop offset="0.55" stop-color="#0E0B1A"/>
      <stop offset="1" stop-color="#07070A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="24" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stem" x1="152" y1="92" x2="240" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="foot" x1="150" y1="352" x2="366" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wave" x1="146" y1="0" x2="372" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#67E8F9"/>
      <stop offset="0.7" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep glass canvas -->
  <rect x="20" y="20" width="472" height="472" rx="126" fill="url(#canvas)"/>
  <rect x="20.75" y="20.75" width="470.5" height="470.5" rx="125.25" stroke="#4C3A7A" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M146 76C146 46 172 22 204 22H346C398 22 438 62 438 114V132H146V76Z" fill="url(#glass)"/>

  <!-- Ambient bloom behind the mark -->
  <ellipse cx="248" cy="230" rx="128" ry="128" fill="#7C3AED" opacity="0.32" filter="url(#soft)"/>

  <!-- LYRICX monogram: a confident L, drawn as two weight-balanced strokes -->
  <g filter="url(#markGlow)">
    <rect x="150" y="92" width="82" height="284" rx="17" fill="url(#stem)"/>
    <rect x="150" y="352" width="212" height="56" rx="17" fill="url(#foot)"/>
  </g>

  <!-- A lyric / sound-wave ribbon flowing through the foot -->
  <path d="M134 318 C 168 318, 178 292, 206 292 C 234 292, 244 344, 272 344 C 300 344, 308 306, 336 306 C 364 306, 374 330, 392 330"
        stroke="url(#wave)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Glass rim highlight on the mark -->
  <path d="M166 104 V 352" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny sparkle -->
  <path d="M392 128 L398 144 L414 150 L398 156 L392 172 L386 156 L370 150 L386 144 Z" fill="#A5F3FC" opacity="0.85"/>
</svg>
