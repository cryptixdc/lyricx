name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            args: --win --x64
          - os: macos-latest
            label: macOS arm64
            args: --mac --arm64
          - os: macos-latest
            label: macOS x64
            args: --mac --x64
          - os: ubuntu-latest
            label: Linux x64
            args: --linux --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npx vite build
        env:
          VITE_YTM_ONLY: 'true'
          ELECTRON_DEV: 'false'
          ELECTRON: 'true'

      - name: Package and publish
        run: npx electron-builder --config electron-builder.lyricx.yml ${{ matrix.args }} ${{ env.PUBLISH_FLAG }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FLAG: ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '' }}
